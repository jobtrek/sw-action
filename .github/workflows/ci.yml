name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Container Image
    runs-on: ubuntu-latest

    # Run a local registry to push to
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000

    env:
      TEST_TAG: localhost:5001/actions/container-prebuilt-action:latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Docker BuildX
        id: setup-buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host

      - name: Build the Container
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.TEST_TAG }}

      - name: Pull tests
        id: tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: jobtrek/sw
          ref: v1.0.3

      - name: Run the Container
        id: run
        env:
          INPUT_PATH: 'test/test'
          INPUT_LANG: 'rs,js,ts,java,php'
        run: |
          docker run \
            --volume ${{ github.workspace }}:/github/workspace \
            --env INPUT_PATH="$INPUT_PATH" \
            --env INPUT_LANG="$INPUT_LANG" \
            --rm \
            ${{ env.TEST_TAG }}

      - name: Test if the test passed
        id: check
        run: |
          tree test
          if diff -rq test/test test/expected; then
            echo "Test passed"
          else
            echo "Test failed"
            diff -r test/test test/expected
            exit 1
          fi
