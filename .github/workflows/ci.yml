name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Container Image
    runs-on: ubuntu-latest

    # Run a local registry to push to
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000

    env:
      TEST_TAG: localhost:5001/actions/container-prebuilt-action:latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker BuildX
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build the Container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.TEST_TAG }}

      - name: Pull tests
        id: tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jobtrek/sw
          ref: v1.0.7
          persist-credentials: false

      - name: Run the Container
        id: run
        env:
          INPUT_PATH: 'test/test'
          INPUT_LANG: 'rs,js,ts,java,php'
        run: |
          docker run \
            --volume ${{ github.workspace }}:/github/workspace \
            --env INPUT_PATH="$INPUT_PATH" \
            --env INPUT_LANG="$INPUT_LANG" \
            --rm \
            ${{ env.TEST_TAG }}

      - name: Test if the test passed
        id: check
        run: |
          tree test
          if diff -rq test/test test/expected; then
            echo "Test passed"
          else
            echo "Test failed"
            diff -r test/test test/expected
            exit 1
          fi
